name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x86_64, exe: cryptok, target: '' }
          - { os: macos-latest, name: macos-arm64, exe: cryptok, target: '' }
          - { os: macos-latest, name: macos-x86_64, exe: cryptok, target: x86_64-apple-darwin }
          - { os: windows-latest, name: windows-x86_64, exe: cryptok.exe, target: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --target ${{ matrix.target }}
            mkdir -p target/release
            cp target/${{ matrix.target }}/release/${{ matrix.exe }} target/release/
          else
            cargo build --release
          fi
      - name: Package
        shell: bash
        run: |
          d=cryptok-${{ matrix.name }}
          mkdir "$d"
          cp target/release/${{ matrix.exe }} README.md LICENSE.txt "$d"/
          cp -r corpus data "$d"/
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a "$d.zip" "$d"; else tar czf "$d.tar.gz" "$d"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: cryptok-${{ matrix.name }}
          path: cryptok-${{ matrix.name }}.*

  model:
    # Pre-trained model so users can skip `cryptok train`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run --release -- train --out cryptok.cklm
      - uses: actions/upload-artifact@v4
        with:
          name: cryptok-model
          path: cryptok.cklm

  publish:
    needs: [build, model]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
