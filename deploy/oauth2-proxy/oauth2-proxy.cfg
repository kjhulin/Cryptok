# /etc/oauth2-proxy/oauth2-proxy.cfg  (https://oauth2-proxy.github.io/oauth2-proxy/)
# Secrets come from the environment (see the systemd unit), not from this file:
#   OAUTH2_PROXY_CLIENT_SECRET  Google OAuth client secret
#   OAUTH2_PROXY_COOKIE_SECRET  32 random bytes, e.g.  openssl rand -base64 32 | tr -- '+/' '-_'

provider      = "google"
client_id     = "REPLACE_ME.apps.googleusercontent.com"
redirect_url  = "https://cryptok.space/oauth2/callback"

http_address  = "127.0.0.1:4180"
reverse_proxy = true            # trust X-Forwarded-* from nginx on this machine
set_xauthrequest = true         # returns X-Auth-Request-Email to nginx's auth_request

# Who may sign in. Use ONE of these:
#  a) an allow-list of Google accounts, one address per line (recommended for a small group)
authenticated_emails_file = "/etc/oauth2-proxy/allowed-emails.txt"
#  b) everyone in a Google Workspace domain:   email_domains = ["example.com"]
# Never use  email_domains = ["*"]  here: that admits any Google account.

# Session cookie
cookie_name     = "_cryptok_session"
cookie_secure   = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire   = "8h"
cookie_refresh  = "1h"

# Only allow returning to this site after sign-in (blocks open redirects)
whitelist_domains = ["cryptok.space"]
skip_provider_button = true     # go straight to Google
silence_ping_logging = true
