# Goes in the http {} context: save as /etc/nginx/conf.d/cryptok-http.conf
# (the stock nginx.conf already includes conf.d/*.conf inside http {}).

# The app is bound to loopback; nginx is the only thing that talks to it.
upstream cryptok_app {
    server 127.0.0.1:8077;
}

# Per-client rate limits. The app has global job caps but cannot tell clients apart
# behind a proxy, so this is where per-client limiting lives.
limit_req_zone  $binary_remote_addr zone=cryptok_page:10m rate=10r/s;   # page + small calls
limit_req_zone  $binary_remote_addr zone=cryptok_solve:10m rate=30r/m;  # searches (CPU heavy)
limit_req_zone  $binary_remote_addr zone=cryptok_ocr:10m   rate=6r/m;   # image uploads
limit_conn_zone $binary_remote_addr zone=cryptok_conn:10m;
limit_req_status  429;
limit_conn_status 429;
