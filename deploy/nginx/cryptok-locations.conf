# Goes inside the existing  server { listen 443 ssl; server_name cryptok.space; ... }  block:
#     include /etc/nginx/snippets/cryptok-locations.conf;
# Requires cryptok-http.conf (http context) and cryptok-proxy.inc (snippets), and a running
# oauth2-proxy on 127.0.0.1:4180 (deploy/oauth2-proxy/oauth2-proxy.cfg).

# ---------------------------------------------------------------- Google sign-in (oauth2-proxy)
# These paths are shared by every protected app on this host. Do not rename /oauth2/ unless
# you also change oauth2-proxy's proxy_prefix.
location /oauth2/ {
    proxy_pass         http://127.0.0.1:4180;
    proxy_set_header   Host                    $host;
    proxy_set_header   X-Real-IP               $remote_addr;
    proxy_set_header   X-Scheme                $scheme;
    proxy_set_header   X-Auth-Request-Redirect $request_uri;
    limit_req          zone=cryptok_page burst=20 nodelay;
}

# Internal sub-request: 202 = signed in, 401 = not signed in.
location = /oauth2/auth {
    internal;
    proxy_pass              http://127.0.0.1:4180;
    proxy_set_header        Host             $host;
    proxy_set_header        X-Real-IP        $remote_addr;
    proxy_set_header        X-Scheme         $scheme;
    proxy_set_header        X-Original-URI   $request_uri;
    proxy_set_header        Content-Length   "";
    proxy_pass_request_body off;
    # nginx applies the *sub-request's* body limit to the original upload, so without this a
    # photo over 1 MB fails with a 500 before it reaches the app. (The body itself is not sent.)
    client_max_body_size    26m;
}

# Browsers navigating to the page are sent to Google; API calls just get 401 (a redirect to
# accounts.google.com would break fetch() and EventSource).
location @cryptok_signin {
    return 302 /oauth2/start?rd=$scheme://$host$request_uri;
}

# ---------------------------------------------------------------- the solver at /solver/
location = /solver {
    return 301 /solver/;
}

# The page. A trailing slash on proxy_pass strips the /solver/ prefix, so the app sees "/".
location /solver/ {
    auth_request       /oauth2/auth;
    error_page 401 =   @cryptok_signin;
    auth_request_set   $cryptok_user $upstream_http_x_auth_request_email;

    limit_req          zone=cryptok_page burst=20 nodelay;
    limit_conn         cryptok_conn 20;
    client_max_body_size 1k;                # nothing but GETs here

    include            /etc/nginx/snippets/cryptok-proxy.inc;
    proxy_read_timeout 60s;
    proxy_pass         http://cryptok_app/;
}

# Cheap status call the page makes on load: counted with page requests, not searches.
location = /solver/api/info {
    auth_request       /oauth2/auth;
    auth_request_set   $cryptok_user $upstream_http_x_auth_request_email;

    limit_req          zone=cryptok_page burst=20 nodelay;
    client_max_body_size 1k;

    include            /etc/nginx/snippets/cryptok-proxy.inc;
    proxy_read_timeout 10s;
    proxy_pass         http://cryptok_app/api/info;
}

# JSON API (crib, Vigenère, transposition). 401 stays 401.
location /solver/api/ {
    auth_request       /oauth2/auth;
    auth_request_set   $cryptok_user $upstream_http_x_auth_request_email;

    limit_req          zone=cryptok_solve burst=10 nodelay;
    limit_conn         cryptok_conn 20;
    client_max_body_size 1k;

    include            /etc/nginx/snippets/cryptok-proxy.inc;
    proxy_read_timeout 180s;
    proxy_pass         http://cryptok_app/api/;
}

# Long searches stream progress as Server-Sent Events: do not buffer, and allow the app's
# own time limit (120 s by default) to expire before nginx gives up.
location ~ ^/solver/api/(rkc|known)$ {
    auth_request       /oauth2/auth;
    auth_request_set   $cryptok_user $upstream_http_x_auth_request_email;

    limit_req          zone=cryptok_solve burst=5 nodelay;
    limit_conn         cryptok_conn 6;
    client_max_body_size 1k;

    include            /etc/nginx/snippets/cryptok-proxy.inc;
    proxy_buffering    off;
    proxy_cache        off;
    gzip               off;
    add_header         X-Accel-Buffering no always;
    proxy_read_timeout 180s;
    proxy_pass         http://cryptok_app/api/$1$is_args$args;
}

# Image upload for OCR: the one place a request body is expected (the app caps it at 25 MB).
location = /solver/api/ocr {
    auth_request       /oauth2/auth;
    auth_request_set   $cryptok_user $upstream_http_x_auth_request_email;

    limit_req          zone=cryptok_ocr burst=3 nodelay;
    limit_conn         cryptok_conn 4;
    client_max_body_size 26m;
    client_body_timeout 60s;
    # Privacy: stream the photo straight to the app. With buffering on, nginx would write any
    # body larger than client_body_buffer_size to a temporary file under client_body_temp_path.
    proxy_request_buffering off;
    client_body_buffer_size 64k;

    include            /etc/nginx/snippets/cryptok-proxy.inc;
    proxy_read_timeout 90s;
    proxy_pass         http://cryptok_app/api/ocr;
}

# Everything else under /solver/ (favicon, /solver/healthz) falls to /solver/ above, so it is
# behind the same sign-in.
